<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    cursor:none;
}

#slideshow{
    position:fixed;
    inset:0;
}

.slide{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    opacity:0;
    transform:scale(1);

    will-change:opacity,transform;

    transition:
        opacity 2.5s cubic-bezier(.4,0,.2,1);
}

.slide.active{
    opacity:1;
    animation:kenburns 8s ease-in-out forwards;
}

@keyframes kenburns{

0%{
transform:scale(1);
filter:brightness(.96);
}

50%{
transform:scale(1.04);
filter:brightness(1);
}

100%{
transform:scale(1.08);
filter:brightness(1.03);
}

}
</style>

</head>
<body>

<div id="slideshow"></div>

<script>

const images=[

"https://i.postimg.cc/Yh4D1gND/hilol.png",
"https://i.postimg.cc/zVL2nWwP/hilol2.png",
"https://i.postimg.cc/rzZY0g4H/phool.png",
"https://i.postimg.cc/147YnMFb/hilol4.png",
"https://i.postimg.cc/8sXnJwvt/hilol5.png",
"https://i.postimg.cc/ThNHLQbk/hilol6.png",
"https://i.postimg.cc/QVYn9S7Y/hilol7.png",
"https://i.postimg.cc/jC3kwvfk/hilol8.png",
"https://i.postimg.cc/Sj1t2V9z/HILOL9.png"

];

const slideshow=document.getElementById("slideshow");

images.forEach((src,index)=>{

const slide=document.createElement("div");
slide.className="slide";

slide.style.backgroundImage=`url('${src}')`;

if(index===0)
slide.classList.add("active");

slideshow.appendChild(slide);

});

const slides=document.querySelectorAll(".slide");

let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},6000);

// Preload all images
images.forEach(src=>{
const img=new Image();
img.src=src;
});

</script>

</body>
</html>
