<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Slide */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    transition:opacity 2.5s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* Image */

.slide img{

    max-width:90vw;
    max-height:90vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:18px;

    animation:zoom 7s ease-in-out forwards;

    box-shadow:
    0 0 60px rgba(255,255,255,.08),
    0 30px 90px rgba(0,0,0,.65);

}

@keyframes zoom{

from{
transform:scale(1);
}

to{
transform:scale(1.04);
}

}

/* Vignette */

body::after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(circle,
rgba(0,0,0,0) 45%,
rgba(0,0,0,.45) 100%);
}
</style>

</head>
<body>

<div id="slides"></div>

<script>

const images=[

"https://i.postimg.cc/Yh4D1gND/hilol.png",
"https://i.postimg.cc/zVL2nWwP/hilol2.png",
"https://i.postimg.cc/rzZY0g4H/phool.png",
"https://i.postimg.cc/147YnMFb/hilol4.png",
"https://i.postimg.cc/8sXnJwvt/hilol5.png",
"https://i.postimg.cc/ThNHLQbk/hilol6.png",
"https://i.postimg.cc/QVYn9S7Y/hilol7.png",
"https://i.postimg.cc/jC3kwvfk/hilol8.png",
"https://i.postimg.cc/Sj1t2V9z/HILOL9.png"

];

const container=document.getElementById("slides");

images.forEach((src,i)=>{

const slide=document.createElement("div");
slide.className="slide";

const img=document.createElement("img");
img.src=src;
img.draggable=false;

slide.appendChild(img);

if(i===0) slide.classList.add("active");

container.appendChild(slide);

});

const slides=document.querySelectorAll(".slide");

let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},5500);

// Preload
images.forEach(src=>{
const img=new Image();
img.src=src;
});

</script>

</body>
</html>
