<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ For My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    cursor:none;
}

/* Slides */

.slide{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    transition:opacity 3s ease;
}

.slide.active{
    opacity:1;
}

/* Images */

.slide img{
    width:100%;
    height:100%;
    object-fit:contain; /* Keeps images sharp */
    animation:kenburns 8s ease-in-out forwards;
    user-select:none;
    pointer-events:none;
}

/* Romantic zoom */

@keyframes kenburns{

0%{
transform:scale(1);
filter:brightness(.95);
}

50%{
transform:scale(1.03);
filter:brightness(1);
}

100%{
transform:scale(1.06);
filter:brightness(1.03);
}

}

/* Soft vignette */

.vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle,
        rgba(0,0,0,0) 45%,
        rgba(0,0,0,.25) 100%);
}

/* Floating particles */

.particle{
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    animation:float linear infinite;
}

@keyframes float{

from{
transform:translateY(110vh);
opacity:0;
}

20%{
opacity:.8;
}

80%{
opacity:.8;
}

to{
transform:translateY(-20vh);
opacity:0;
}

}
</style>

</head>
<body>

<div id="slides"></div>

<div class="vignette"></div>

<script>

const images=[

"https://i.postimg.cc/Yh4D1gND/hilol.png",
"https://i.postimg.cc/zVL2nWwP/hilol2.png",
"https://i.postimg.cc/rzZY0g4H/phool.png",
"https://i.postimg.cc/147YnMFb/hilol4.png",
"https://i.postimg.cc/8sXnJwvt/hilol5.png",
"https://i.postimg.cc/ThNHLQbk/hilol6.png",
"https://i.postimg.cc/QVYn9S7Y/hilol7.png",
"https://i.postimg.cc/jC3kwvfk/hilol8.png",
"https://i.postimg.cc/Sj1t2V9z/HILOL9.png"

];

const container=document.getElementById("slides");

images.forEach((src,index)=>{

const slide=document.createElement("div");
slide.className="slide";

const img=document.createElement("img");
img.src=src;

slide.appendChild(img);

if(index===0)
slide.classList.add("active");

container.appendChild(slide);

});

const slides=document.querySelectorAll(".slide");

let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},6000);

// Preload images
images.forEach(src=>{
const img=new Image();
img.src=src;
});

// Romantic floating particles
for(let i=0;i<35;i++){

const p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(10+Math.random()*12)+"s";

p.style.animationDelay=(-Math.random()*20)+"s";

p.style.opacity=Math.random();

document.body.appendChild(p);

}

</script>

</body>
</html>
